t].find(x=>dishNames[x])))});document.querySelectorAll('.mapstop').forEach(btn=>{let key=({a:'street',b:'main',c:'sweet',d:'drink'})[[...btn.classList].find(x=>'abcd'.includes(x)&&x.length===1)];if(saved.stamps.includes(key)){let mark=btn.querySelector('.stamp-mark');if(!mark){mark=document.createElement('span');mark.className='stamp-mark';mark.textContent='已打卡';btn.appendChild(mark)}mark.classList.add('show')}else btn.querySelector('.stamp-mark')?.remove()})};updateHearts();$('#passportBtn').onclick=()=>{$('#passport').hidden=false;updatePassport();$('#closePassport').focus()};$('#closePassport').onclick=()=>{$('#passport').hidden=true;$('#passportBtn').focus()};$('#passport').addEventListener('click',e=>{if(e.target.id==='passport')$('#closePassport').click()});$('#resetPassport').onclick=()=>{saved={stamps:[],likes:[]};persist();updatePassport();updateHearts();toast('护照已重新开始')};

function chapter(){show('美食路线图 📍','<p class="scrap-small">点击站点直接跳转，沿途别忘了收集印章。</p><div class="scrap-options">'+names.map((n,i)=>'<button data-chapter="'+i+'">'+String(i+1).padStart(2,'0')+' · '+n+'</button>').join('')+'</div>');body.querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>{let i=+b.dataset.chapter;hide();document.getElementById(ids[i]).scrollIntoView({behavior:'smooth'})})}
$('#chapterBtn').onclick=chapter;
const foods={5:['烤串','章鱼小丸子','煎饼果子','手抓饼'],6:['草莓蛋糕','焦糖布丁','甜甜圈','冰淇淋'],7:['珍珠奶茶','抹茶饮品','水果茶','冰咖啡']};
const sectionNames={5:'街头小吃',6:'甜品研究所',7:'饮品补给站'};
document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{const k=b.dataset.pick;show('♥ 收藏 '+sectionNames[k],'<p>你最想尝哪一种？点击就能收入美食手账。</p><div class="scrap-options">'+foods[k].map(f=>'<button data-food="'+f+'" '+(state.picks[k]===f?'class="selected"':'')+'>'+f+(state.picks[k]===f?' ✓':'')+'</button>').join('')+'</div>');body.querySelectorAll('[data-food]').forEach(x=>x.onclick=()=>{state.picks[k]=x.dataset.food;save();show('收藏成功！','<p>🍽️ <b>'+x.dataset.food+'</b> 已放进你的美食手账。</p>','继续逛逛',hide)})});
const qs=[{q:'周末的美食计划，你会选？',a:['去夜市挖掘隐藏小吃','在咖啡馆吃甜品','找一家新开的特色餐厅']},{q:'只能带走一样食物，你选？',a:['热腾腾的汉堡','草莓奶油蛋糕','清爽的水果茶']},{q:'你喜欢怎样的美食体验？',a:['热闹、随性、边走边吃','悠闲、精致、慢慢品尝','新奇、有创意、充满惊喜']}];
let current=0;
function quiz(){if(current>=qs.length){result();return}let q=qs[current];show('美食趣味测试 · '+(current+1)+'/3','<p><b>'+q.q+'</b></p><div class="scrap-options">'+q.a.map((v,i)=>'<button data-answer="'+i+'" '+(state.answers[current]===i?'class="selected"':'')+'>'+['A','B','C'][i]+' · '+v+'</button>').join('')+'</div><p class="scrap-small">选择后才能进入下一题。</p>','下一题 →',()=>{if(!Number.isInteger(state.answers[current])){alert('请先选择一个答案');return}current++;quiz()});body.querySelectorAll('[data-answer]').forEach(x=>x.onclick=()=>{state.answers[current]=+x.dataset.answer;state.answers=state.answers.slice(0,current+1);save();quiz()})}
function result(){const sums=[0,0,0];state.answers.forEach(i=>{if(Number.isInteger(i))sums[i]++});const type=sums.indexOf(Math.max(...sums));const profiles=[['街头寻味家','你偏爱热闹和烟火气，下一口惊喜就在街角。'],['甜蜜收藏家','你擅长发现生活里的小确幸，甜品是你的快乐开关。'],['新奇探索家','你喜欢解锁新口味，越有创意越想试一口。']];state.result=profiles[type][0];save();show('测试完成！🎉','<p>你的美食人格是：</p><h2>'+profiles[type][0]+'</h2><p>'+profiles[type][1]+'</p>','查看美食手账 →',journal)}
$('.overlay-quiz').onclick=()=>{current=0;quiz()};$('.overlay-next').onclick=()=>{current=0;quiz()};
function journal(){const picks=Object.entries(sectionNames).map(([k,v])=>'<p>✦ '+v+'：<b>'+(state.picks[k]||'还没收藏')+'</b></p>').join('');const stamps=(window.saved&&window.saved.stamps)||[];show('我的美食探索手账 📒',picks+'<p>🎟️ 地图印章：'+(stamps.length||$('#progress').textContent.split('/')[0])+'/4</p><p>⭐ 美食人格：<b>'+(state.result||'完成趣味测试后解锁')+'</b></p>','继续探索 →',()=>{hide();$('#map').scrollIntoView({behavior:'smooth'})})}
$('.overlay-journal').onclick=journal;
$('.overlay-restart').onclick=()=>show('开启下一趟美食之旅？','<p>重新开始会清空本次收藏、测试结果和地图印章。</p>','确认重新开始',()=>{state={picks:{},answers:[],result:''};save();try{localStorage.removeItem('food-carnival-passport-v1')}catch(e){}hide();location.reload()});
$('.overlay-share').onclick=async()=>{if(navigator.share){try{await navigator.share({title:'食刻开席！',text:'一起来探索美食嘉年华',url:location.href})}catch(e){}}else show('分享美食之旅','<p>你可以复制浏览器地址，分享给朋友。若是本地文件，请先将网页发布到线上再分享。</p>')};
// Map hotspots also offer direct section travel after stamp; keep original stamp interaction.
document.querySelectorAll('.mapstop').forEach(b=>b.addEventListener('click',()=>{const target={street:'p5',main:'staples',sweet:'p6',drink:'p7'}[b.dataset.topic];setTimeout(()=>{if($('#dialog').hidden){show('下一站：'+({street:'街头小吃区',main:'主食图鉴',sweet:'甜品研究所',drink:'饮品补给站'}[b.dataset.topic]),'<p>地图打卡完成！要直接前往这个美食站点吗？</p>','前往这一站 →',()=>{hide();document.getElementById(target).scrollIntoView({behavior:'smooth'})})}},80)}));
})();
</script><button class="chapter-nav" id="chapterBtn" aria-label="打开章节目录">☰ 目录</button><div class="scrap-panel" id="scrapPanel" role="dialog" aria-modal="true" aria-labelledby="scrapTitle" hidden><div class="scrap-card"><h2 id="scrapTitle"></h2><div id="scrapBody"></div><div class="scrap-actions"><button class="scrap-close" id="scrapClose">关闭 ✕</button><button id="scrapNext" hidden>继续 →</button></div></div></div>
<style>
/* Extra interactions, no changes to the original artwork */
.food-tools{position:fixed;z-index:8;left:max(10px,calc((100vw - 430px)/2 + 10px));bottom:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.food-tool{font:700 12px/1.2 'Microsoft YaHei',sans-serif;border:2px solid #70412b;border-radius:22px;background:#ffdf9b;color:#5a3225;padding:9px 12px;box-shadow:2px 3px 0 #8d5537;cursor:pointer;max-width:145px}
.food-tool:nth-child(2){background:#f3c7b1}.food-tool:active{transform:translateY(2px);box-shadow:1px 1px 0 #8d5537}
.reading-track{position:fixed;top:0;left:0;width:100%;height:5px;background:transparent;z-index:30;pointer-events:none}.reading-bar{height:100%;width:0;background:#c45d38;transition:width .12s linear}
.extra-backdrop{position:fixed;inset:0;z-index:28;background:#281912aa;display:grid;place-items:center;padding:18px}.extra-backdrop[hidden]{display:none}
.extra-paper{position:relative;width:min(100%,380px);background:#fff0d0;border:3px solid #76452e;outline:5px solid #fff0d0;box-shadow:7px 9px 0 #39251e66;padding:28px 23px 24px;max-height:85vh;overflow:auto;text-align:center;background-image:repeating-linear-gradient(0deg,transparent,transparent 29px,#b9865720 30px)}
.extra-paper h2{font-size:25px;color:#803e2d;margin:0 0 15px}.extra-paper p{line-height:1.9}.extra-big{font-size:33px;font-weight:900;color:#9b4732;margin:16px 0}.extra-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:19px}.extra-actions button{border:2px solid #71412d;border-radius:17px;background:#f6d083;color:#5c3527;padding:10px 15px;font-weight:800;cursor:pointer}.extra-actions .extra-close{background:#fff7e5}
@media(max-width:440px){.food-tools{bottom:12px}.food-tool{padding:8px 10px;font-size:11px}}
</style>
<div class="reading-track" aria-hidden="true"><div class="reading-bar" id="readingBar"></div></div>
<div class="food-tools" aria-label="更多美食互动"><button class="food-tool" id="randomFood">🎲 今日吃什么</button><button class="food-tool" id="foodFacts">💡 美食冷知识</button></div>
<div class="extra-backdrop" id="extraBackdrop" hidden role="dialog" aria-modal="true" aria-labelledby="extraTitle"><div class="extra-paper"><h2 id="extraTitle"></h2><div id="extraContent"></div><div class="extra-actions" id="extraActions"></div></div></div>
<script>
(()=>{
const $=id=>document.getElementById(id),layer=$('extraBackdrop'),heading=$('extraTitle'),content=$('extraContent'),actions=$('extraActions');
const menu=['🍕 芝士披萨','🍔 多汁汉堡','🍛 咖喱饭','🍡 章鱼小丸子','🍢 香烤串串','🍰 草莓蛋糕','🍮 焦糖布丁','🍩 甜甜圈','🧋 珍珠奶茶','🍵 抹茶饮品'];
const facts=[['披萨的小秘密','现代披萨与意大利那不勒斯的饮食传统密切相关。'],['咖喱不止一种','“咖喱”并不是单一香料，而是多种香料组合及菜肴的统称。'],['奶茶的百变风味','茶、奶与不同配料的组合，让奶茶拥有许多地域特色。'],['甜甜圈的形状','中间留孔有助于面团在油炸时更均匀地受热。'],['巧克力的旅程','巧克力的主要原料来自可可树的种子。'],['味觉的小知识','人能感知甜、酸、苦、咸、鲜等基本味觉，食物香气也影响整体风味。']];
let lastFocus=null,previous=-1;
function open(t,html,buttons){lastFocus=document.activeElement;heading.textContent=t;content.innerHTML=html;actions.replaceChildren();buttons.forEach(([label,fn,secondary])=>{let b=document.createElement('button');b.textContent=label;if(secondary)b.className='extra-close';b.onclick=fn;actions.appendChild(b)});layer.hidden=false;actions.querySelector('button')?.focus()}
function close(){layer.hidden=true;lastFocus?.focus()}
function draw(){let n=Math.floor(Math.random()*menu.length);if(menu.length>1&&n===previous)n=(n+1+Math.floor(Math.random()*(menu.length-1)))%menu.length;previous=n;open('今日吃什么？ 🎲','<p>美食命运转盘为你选中了：</p><div class="extra-big">'+menu[n]+'</div><p>心动了吗？不满意还能再抽一次！</p>',[['再抽一次 ↻',draw],['收下推荐 ✓',()=>{close();const t=document.querySelector('#toast');if(t){t.textContent='已收下今日推荐：'+menu[n];t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1900)}}],['关闭',close,true]])}
let factIndex=0;function fact(){let item=facts[factIndex++%facts.length];open('美食冷知识 💡','<div class="extra-big" style="font-size:22px">'+item[0]+'</div><p>'+item[1]+'</p>',[['再看一条 →',fact],['我知道啦 ✓',close,true]])}
$('randomFood').addEventListener('click',draw);$('foodFacts').addEventListener('click',fact);layer.addEventListener('click',e=>{if(e.target===layer)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!layer.hidden)close()});
let pending=false;function progress(){pending=false;const max=document.documentElement.scrollHeight-innerHeight;$('readingBar').style.width=(max>0?Math.min(100,Math.max(0,scrollY/max*100)):100)+'%'}
addEventListener('scroll',()=>{if(!pending){pending=true;requestAnimationFrame(progress)}},{passive:true});addEventListener('resize',progress);progress();
})();
</script>
</body></html>
